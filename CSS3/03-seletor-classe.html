<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Seleção de um elemento que possui simultaneamente as classes 'brown' e 'letra-maiuscula'. */
        .brown.letra-maiuscula {
            color: pink;
        }

        .bolinha {
            color: green;
        }

        .nao-vou-usar {
            color: green;
        }

        .brown {
            color: brown;
        }

        .letra-maisculula {
            text-transform: uppercase;
        }

        /* Aprendi a propriedade CSS 'text-transform' e usei o valor 'uppercase' para deixar o texto em letras maiúsculas. */
        .letra-minuscula {
            text-transform: lowercase;
        }
    </style>
</head>

<body>
    <div>
        <ul>
            <li class="bolinha">Item 1</li>
            <li class="bolinha">Item 2</li>
            <li class="classe-que-nao-existe">Item 3</li>
            <li class="letra-maisculula">Item 4</li>
            <li class="letra-minuscula">ITEM 5</li>
            <li class="brown letra-maisculula">Item 6</li>
            <li>Item 5</li>

        </ul>
    </div>
</body>

</html>
